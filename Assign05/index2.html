<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sliding Images - Part 2</title>
    <link href="Part2/css/styles.css" rel="stylesheet" media="screen" />
  </head>

  <body>
    <div id="page">
        <h1>Part2</h1>
      <div id="navigation">
        <a href="index.html">Go to Part 1</a>
      </div>

      <div id="main-content">
        <section id="home">
          <div id="container" class="container">
            <div class="image_wrapper">
              <img id="pic1" src="Part2/images/1.jpg" alt="Image 1" />
              <img id="pic2" src="Part2/images/2.jpg" alt="Image 2" />
              <img id="pic3" src="Part2/images/3.jpg" alt="Image 3" />
              <img id="pic4" src="Part2/images/4.jpg" alt="Image 4" />
              <img id="pic5" src="Part2/images/5.jpg" alt="Image 5" />
              <img id="pic6" src="Part2/images/6.jpg" alt="Image 6" />
              <img id="pic7" src="Part2/images/7.jpg" alt="Image 7" />
            </div>

            <!-- Navigation for the images -->
            <div class="next"></div>
            <div class="prev"></div>

            <ul class="nav">
              <li id="nav1" class="selected"> 
                <a class="thumbnav" href="Part2/images/1.jpg" rel="Part2/images/thumbs/1.jpg">Image 1</a>
              </li>
              <li id="nav2">
                <a class="thumbnav" href="Part2/images/2.jpg" rel="Part2/images/thumbs/2.jpg">Image 2</a>
              </li>
              <li id="nav3">
                <a class="thumbnav" href="Part2/images/3.jpg" rel="Part2/images/thumbs/3.jpg">Image 3</a>
              </li>
              <li id="nav4">
                <a class="thumbnav" href="Part2/images/4.jpg" rel="Part2/images/thumbs/4.jpg">Image 4</a>
              </li>
              <li id="nav5">
                <a class="thumbnav" href="Part2/images/5.jpg" rel="Part2/images/thumbs/5.jpg">Image 5</a>
              </li>
              <li id="nav6">
                <a class="thumbnav" href="Part2/images/6.jpg" rel="Part2/images/thumbs/6.jpg">Image 6</a>
              </li>
              <li id="nav7">
                <a class="thumbnav" href="Part2/images/7.jpg" rel="Part2/images/thumbs/7.jpg">Image 7</a>
              </li>
              <li class="preview">
                <div class="preview_wrapper"></div>
                <span></span>
              </li>
            </ul>
          </div>
        </section>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript">
      $(document).ready(function() {
        var counter = 1;

        // Display the thumb preview
        $("li").animate().hover(function() {
          $("li.preview").css("display", "block");
        }, function() {
          $("li.preview").css("display", "none");
        });

        $("a.thumbnav").hover(function() {
          var rel = $(this).attr("rel");
          $("div.preview_wrapper").css("background", "url(" + rel + ") no-repeat center");
        });

        var sign = "";
        var imgNum = 0;
        var move = 0;

        $("a.thumbnav").click(function(event) {
          event.preventDefault();
          var ref = $(this).attr("href");

          // Determine image number based on href
          if (ref.indexOf("1") !== -1) imgNum = 1;
          else if (ref.indexOf("2") !== -1) imgNum = 2;
          else if (ref.indexOf("3") !== -1) imgNum = 3;
          else if (ref.indexOf("4") !== -1) imgNum = 4;
          else if (ref.indexOf("5") !== -1) imgNum = 5;
          else if (ref.indexOf("6") !== -1) imgNum = 6;
          else if (ref.indexOf("7") !== -1) imgNum = 7;

          if (counter - imgNum < 0) {
            move = (imgNum - counter) * 650;
            sign = "-=";
          } else {
            move = (counter - imgNum) * 650;
            sign = "+=";
          }

          $("img").animate({
            left: sign + move
          }, 250);

          counter = imgNum;

          $("li.selected").removeClass("selected");
          $("li#nav" + imgNum).addClass("selected");
        });

        // Move the thumbnail preview
        $("li#nav1").hover(function() {
          $("ul.preview").css("left", "-34.5px");
        });
        $("li#nav2").hover(function() {
          $("ul.preview").css("left", "-14px");
        });
        $("li#nav3").hover(function() {
          $("ul.preview").css("left", "5px");
        });
        $("li#nav4").hover(function() {
          $("ul.preview").css("left", "24px");
        });
        $("li#nav5").hover(function() {
          $("ul.preview").css("left", "43px");
        });
        $("li#nav6").hover(function() {
          $("ul.preview").css("left", "62px");
        });
        $("li#nav7").hover(function() {
          $("ul.preview").css("left", "81px");
        });

        // Next button click
        $("div.next").click(function() {
          if (counter == 7) {
            $("img").animate({
              left: "+=" + ((counter - 1) * 650),
            }, 50);
            $("li.selected").removeClass("selected");
            $("#nav1").addClass("selected");
            counter = 1;
          } else if (counter < 7) {
            $("img").animate({
              left: "-=650",
            }, 250);
            $("li.selected").addClass("prevNav");
            $("li.selected").removeClass("selected");
            $("li.prevNav").next().addClass("selected");
            $("li.prevNav").removeClass("prevNav");
            counter++;
          }
        });

        // Previous button click
        $("div.prev").click(function() {
          if (counter == 1) {
            $("img").animate({
              left: "-=" + (6 * 650)
            }, 50);
            $("li.selected").removeClass("selected");
            $("#nav7").addClass("selected");
            counter = 7;
          } else if (counter > 1) {
            $("img").animate({
              left: "+=650"
            }, 250);
            $("li.selected").addClass("prevNav");
            $("li.selected").removeClass("selected");
            $("li.prevNav").next().addClass("selected");
            $("li.prevNav").removeClass("prevNav");
            counter--;
          }
        });
      });
    </script>
  </body>
</html>
